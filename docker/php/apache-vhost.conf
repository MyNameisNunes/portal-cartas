<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # config/ e partials/ so sao usados via require interno, a partir das paginas.
    # Servidos direto pela URL eles rodam fora do escopo que esperam ($usuario,
    # $paginaAtual) e morrem no meio da renderizacao, devolvendo 200 com HTML
    # pela metade. Nao ha rota legitima para eles.
    <Directory /var/www/html/config>
        Require all denied
    </Directory>

    <Directory /var/www/html/partials>
        Require all denied
    </Directory>

    # uploads guarda arquivos enviados pelo usuario: servir como conteudo
    # estatico e nunca executar como PHP.
    <Directory /var/www/html/uploads>
        Options -Indexes -ExecCGI
        php_flag engine off
        <FilesMatch "\.(?i:ph(p[0-9]?|tml|ar)|shtml)$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
